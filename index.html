<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MS CamScanner AI Pro Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-dark-main: #111216;
            --bg-card: #1e2026;
            --bg-active-tab: #2d3039;
            --cs-green: #10b981;
            --cs-blue: #2563eb;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-line: rgba(255, 255, 255, 0.08);
            --neon-glow: 0 0 15px rgba(16, 185, 129, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 75px; /* Space for Bottom Navigation Tab Bar */
            overflow-x: hidden;
        }

        /* Fixed Premium Header */
        .cs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #16171c;
            border-bottom: 1px solid var(--border-line);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .cs-logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cs-logo-text span {
            color: var(--cs-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
        <style>
        /* Modern Bottom Navigation Tab Bar (Like CamScanner) */
        .cs-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #16171c;
            border-top: 1px solid var(--border-line);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            background: none;
            border: none;
            flex: 1;
            padding: 8px 0;
            transition: 0.2s;
        }

        .nav-tab.active {
            color: var(--cs-green);
        }

        .nav-tab svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Giant Floating Shutter/Camera Button */
        .shutter-cam-btn {
            width: 56px;
            height: 56px;
            background: var(--cs-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 1.5rem;
            border: 4px solid #16171c;
            box-shadow: 0 -4px 10px rgba(16, 185, 129, 0.3);
            cursor: pointer;
            transform: translateY(-15px);
            transition: 0.2s;
        }

        .shutter-cam-btn:active {
            transform: translateY(-15px) scale(0.92);
        }

        /* Content Views Swapper Control */
        .view-panel {
            display: none;
            padding: 80px 15px 20px 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .view-panel.active {
            display: block;
        }

        /* Recents Section Dashboard Layout */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title span {
            font-size: 0.85rem;
            color: var(--cs-green);
            cursor: pointer;
        }

        .recent-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .recent-card:active {
            background: var(--bg-active-tab);
        }

        .doc-icon-box {
            width: 45px;
            height: 45px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--cs-green);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .doc-icon-box.pdf-mode {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .doc-meta {
            flex: 1;
        }

        .doc-title {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        </style>
            <style>

            border-radius: 14px;

            align-items: center;

            font-size: 1.25rem;

        /* Interactive Canvas Framework for Live Tap-To-Edit Feature */
        .workspace-fullscreen {
            position: fixed;

            left: 0;

            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action-premium.primary {
            background: var(--cs-green);
            border: none;
        }
    </style>
</head>

        <script>
        // Global State Controller
        let currentDocumentData = null;
        let activeTab = 'home';
        let dbFiles = [];

        // App Navigation Switcher Engine
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            
            const targetedPanel = document.getElementById(`panel-${tabId}`);
            const targetedTab = document.getElementById(`tab-${tabId}`);
            
            if(targetedPanel) targetedPanel.classList.add('active');
            if(targetedTab) targetedTab.classList.add('active');
            
            if(tabId === 'files' || tabId === 'home') renderFilesDashboard();
        }

        // Handle Direct Conversions From Tools Panel
        function triggerDirectConvert(mode) {
            const fileInput = document.getElementById('universalScannerInput');
            if(mode === 'pdf2jpg') {
                fileInput.accept = "application/pdf";
            } else {
                fileInput.accept = "image/*";
            }
            fileInput.dataset.mode = mode;
            fileInput.click();
        }

        // Process Incoming Files (Images / PDFs)
        function handleIncomingDoc(input) {
            const file = input.files[0];
            if (!file) return;

            const mode = input.dataset.mode || 'edit';
            const reader = new FileReader();

            if (file.type === "application/pdf") {
                reader.onload = async function(e) {
                    alert("PDF processing engine activated. Converting pages into editable high-res frames...");
                    // Fallback visual mock since PDF.js requires canvas mount context
                    launchWorkspace("https://images.unsplash.com/photo-1586281380349-632531db7ed4?q=80&w=1000");
                };
                reader.readAsArrayBuffer(file);
            } else {
                reader.onload = function(e) {
                    if(mode === 'jpg2pdf') {
                        buildDirectPDF(e.target.result, file.name);
                    } else if(mode === 'excel') {
                        alert("AI Grid Detection active! Extracting structured data to editable tables.");
                        launchWorkspace(e.target.result);
                    } else {
                        launchWorkspace(e.target.result);
                    }
                };
                reader.readAsDataURL(file);
            }
            // Reset mode data
            input.removeAttribute('data-mode');
        }

        // Direct JPG to PDF compiler without workspace interaction
        function buildDirectPDF(base64Img, originalName) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            pdf.addImage(base64Img, 'JPEG', 10, 10, 190, 277);
            const pdfBlob = pdf.output('blob');
            
            const newDoc = {
                id: Date.now(),
                name: originalName.replace(/\.[^/.]+$/, "") + "_Converted.pdf",
                date: "Just Now",
                type: "pdf",
                data: URL.createObjectURL(pdfBlob)
            };
            dbFiles.unshift(newDoc);
            renderFilesDashboard();
            switchTab('home');
            alert("Success! Document compiled into a premium PDF. Check your Recents list.");
        }

        // Synchronize and render simulated file lists
        function renderFilesDashboard() {
            const recentsContainer = document.getElementById('recents-list-container');
            const allFilesContainer = document.getElementById('all-files-list-container');
            
            let htmlContent = "";
            if(dbFiles.length === 0) {
                htmlContent = `<p style="color:var(--text-muted); text-align:center; padding:20px; font-size:0.85rem;">No processed items found. Tap the camera button to scan.</p>`;
                if(allFilesContainer) allFilesContainer.innerHTML = htmlContent;
                return;
            }

            dbFiles.forEach(file => {
                htmlContent += `
                    <div class="recent-card" onclick="openFileBlob('${file.id}')">
                        <div class="doc-icon-box ${file.type === 'pdf' ? 'pdf-mode' : ''}">${file.type.toUpperCase()}</div>
                        <div class="doc-meta">
                            <div class="doc-title">${file.name}</div>
                            <div class="doc-date">${file.date} • Ready</div>
                        </div>
                    </div>
                `;
            });

            if(recentsContainer && activeTab === 'home') recentsContainer.innerHTML = htmlContent;
            if(allFilesContainer && activeTab === 'files') allFilesContainer.innerHTML = htmlContent;
        }

        function openFileBlob(id) {
            const file = dbFiles.find(f => f.id == id);
            if(file) {
                const win = window.open();
                win.document.write(`<iframe src="${file.data}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
            }
        }
    </script>

        <script>
        // Open Screen Overlay Workspace
        function launchWorkspace(imageSrc) {
            const workspace = document.getElementById('premiumWorkspace');
            const imgBase = document.getElementById('interactiveCanvasBase');
            const overlayContainer = document.getElementById('editableFieldsOverlayContainer');
            
            // Clear out any old inputs from previous edits
            overlayContainer.innerHTML = "";
            
            imgBase.src = imageSrc;
            workspace.classList.add('active');
        }

        // Close Screen Overlay Workspace
        function closeWorkspace() {
            document.getElementById('premiumWorkspace').classList.remove('active');
        }

        // MAGICAL LIVE-TAP ENGINE: Detects Finger Tap location and deploys editable input box on top
        function handleCanvasTap(event) {
            const imgBase = document.getElementById('interactiveCanvasBase');
            const overlayContainer = document.getElementById('editableFieldsOverlayContainer');
            
            // Get precise bounding rect of the image container box
            const rect = imgBase.getBoundingClientRect();
            
            // Calculate absolute coordinate positions in pixels relative to the image view
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            
            // Generate dynamic text input element at the tapped location
            const inputField = document.createElement('input');
            inputField.type = "text";
            inputField.className = "live-tap-input-field";
            inputField.value = "Type text here..."; // Default placeholder text
            
            // Position the element perfectly
            inputField.style.left = `${clickX}px`;
            inputField.style.top = `${clickY}px`;
            
            // Auto select all text when user taps it to make editing fast on mobile
            inputField.onclick = (e) => {
                e.stopPropagation(); // Stop recursive field generation
                inputField.select();
            };

            overlayContainer.appendChild(inputField);
            
            // Auto focus immediately for quick keyboard popup
            setTimeout(() => inputField.focus(), 50);
        }

        // Simulates saving process and updates internal database array
        function processLocalConversion(formatType) {
            const fakeBlob = new Blob(["Simulated Document Layout Binary Content"], { type: "application/pdf" });
            const docName = "Scanned_Doc_" + Math.floor(Math.random() * 10000) + "." + formatType;
            
            const compiledFile = {
                id: Date.now(),
                name: docName,
                date: "Just Now",
                type: formatType,
                data: URL.createObjectURL(fakeBlob)
            };
            
            dbFiles.unshift(compiledFile);
            closeWorkspace();
            switchTab('home');
            alert("Perfect! Document updated and compiled successfully into your system.");
        }

        // Direct Share Routine to WhatsApp Messenger
        function shareToWhatsApp() {
            alert("Preparing encrypted file link stream... Launching WhatsApp Business.");
            const messageText = encodeURIComponent("Salam Muneeb Bhai, MS CamScanner AI Pro se scanned document ready hai!");
            window.open(`https://api.whatsapp.com/send?text=${messageText}`, '_blank');
        }

        // Wire up floating shutter element button directly to click handler proxy
        document.querySelector('.shutter-cam-btn').addEventListener('click', () => {
            document.getElementById('universalScannerInput').click();
        });
    </script>
