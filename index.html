<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS CamScanner AI Pro</title>
    
    <style>
        :root {
            --bg-main: #090a0f;
            --bg-card: rgba(22, 25, 35, 0.75);
            --accent-glow: #00ffcc;
            --accent-blue: #007aff;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-glass: rgba(255, 255, 255, 0.08);
            --neon-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(9, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 5px;
            z-index: 1100;
        }

        .menu-btn span {
            display: block;
            width: 26px;
            height: 3px;
            background: var(--accent-glow);
            border-radius: 2px;
            transition: 0.3s;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
      <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass);
            z-index: 999;
            transition: cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
            padding: 90px 20px 20px 20px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-item {
            display: block;
            width: 100%;
            padding: 14px 18px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: 0.25s;
        }

        .sidebar-item:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: var(--neon-shadow);
            color: var(--accent-glow);
        }

        .main-container {
            margin-top: 80px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .camera-viewport {
            width: 100%;
            max-width: 500px;
            height: 60vh;
            background: #000;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border-glass);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            animation: scanAnim 2.5s linear infinite;
            box-shadow: 0 0 10px var(--accent-glow);
            pointer-events: none;
            display: none;
        }

        @keyframes scanAnim {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .controls-panel {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: var(--accent-glow);
            color: var(--bg-main);
            box-shadow: var(--neon-shadow);
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            background: #ffffff;
            border: 5px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .shutter-btn:active {
            transform: scale(0.9);
            background: var(--accent-glow);
        }
            </style>
        <style>
        .overlay-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 2000;
            display: none;
            padding: 80px 20px 20px 20px;
            overflow-y: auto;
        }

        .overlay-window.active {
            display: block;
        }

        .panel-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            border: 1px solid var(--border-glass);
            margin-top: 20px;
        }

        .editable-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-primary);
            text-align: left;
            min-width: 600px;
        }

        .editable-table th, .editable-table td {
            padding: 14px;
            border-bottom: 1px solid var(--border-glass);
        }

        .editable-table th {
            background: rgba(0, 122, 255, 0.15);
            color: var(--accent-glow);
        }

        .editable-table td input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .ocr-textarea {
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            color: #ffffff;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
            margin-top: 15px;
        }

        .btn-ui {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-ui.success {
            background: rgba(0, 255, 204, 0.2);
            border: 1px solid var(--accent-glow);
            color: var(--accent-glow);
        }
    </style>
</head>
<body>
        <header class="app-header">
        <button class="menu-btn" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="app-title">MS CamScanner AI</div>
        <div style="width: 36px;"></div>
    </header>

    <div class="sidebar" id="sidebarMenu">
        <button class="sidebar-item" onclick="openInvoiceGrid()">📊 Live Invoice / Summary Editor</button>
        <button class="sidebar-item" onclick="triggerHandwritingScan()">📝 Handwriting To Digital Text</button>
        <button class="sidebar-item" id="menuInstallBtn" style="background: var(--accent-glow); color: #000; font-weight: bold; display: none;">📥 Install Application</button>
        <button class="sidebar-item" onclick="location.reload()" style="margin-top: 30px; border-color: rgba(255,0,0,0.2);">🔄 Hard Reset System</button>
    </div>

    <div class="main-container">
        <div class="camera-viewport">
            <video id="webcamStream" class="camera-stream" autoplay playsinline></video>
            <img id="capturePreview" class="camera-stream" style="display: none; position: absolute; top: 0; left: 0;" alt="Preview">
            <div class="scanner-laser" id="laserLine"></div>
        </div>

        <div class="controls-panel">
            <button class="action-btn" id="flashToggleBtn" onclick="toggleHardwareFlash()">⚡</button>
            <button class="shutter-btn" onclick="executeShutterCapture()"></button>
            <button class="action-btn" onclick="dispatchFormatSelector()">📤</button>
        </div>
    </div>
        <div id="invoiceGridOverlay" class="overlay-window">
        <div class="panel-wrapper">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="color: var(--accent-glow);">Invoice Data Desk</h2>
                <button class="btn-ui" onclick="closeInvoiceGrid()">Close Panel</button>
            </div>
            
            <div class="table-container">
                <table class="editable-table" id="invoiceDataTable">
                    <thead>
                        <tr>
                            <th>Item Description</th>
                            <th>Qty</th>
                            <th>Rate</th>
                            <th>Total Amount</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceTableBody">
                        <tr>
                            <td><input type="text" value="Clarins Ultra FLY (76ml)"></td>
                            <td><input type="number" value="10" oninput="calculateGridRowTotal(this)"></td>
                            <td><input type="number" value="892.5" oninput="calculateGridRowTotal(this)"></td>
                            <td><input type="number" value="8925.00" readonly style="color: var(--accent-glow); font-weight: bold;"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr style="background: rgba(0, 255, 204, 0.05);">
                            <td colspan="3" style="text-align: right; font-weight: bold;">Grand Total (PKR):</td>
                            <td id="gridGrandTotal" style="color: var(--accent-glow); font-weight: bold;">8925.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn-ui success" onclick="addNewGridRow()">+ Add Row</button>
                <button class="btn-ui" onclick="exportGridToExcel()">Export Data (CSV)</button>
            </div>
        </div>
    </div>

    <div id="ocrResultOverlay" class="overlay-window">
        <div class="panel-wrapper">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="color: var(--accent-glow);">AI Text Recognition</h2>
                <button class="btn-ui" onclick="closeOcrModal()">Close Panel</button>
            </div>
            <textarea id="ocrTargetTextarea" class="ocr-textarea"></textarea>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn-ui success" onclick="copyOcrTextToClipboard()">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
// END OF PART 5
                const webcamStream = document.getElementById('webcamStream');
        const capturePreview = document.getElementById('capturePreview');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const invoiceGridOverlay = document.getElementById('invoiceGridOverlay');
        const ocrResultOverlay = document.getElementById('ocrResultOverlay');
        const flashToggleBtn = document.getElementById('flashToggleBtn');
        const laserLine = document.getElementById('laserLine');

        let localVideoStream = null;
        let isFlashActive = false;
        let activeVideoTrack = null;
        let lastCapturedBlob = null;
        let deferredPrompt = null;

        // Automatically boot engines on page completion
        window.addEventListener('DOMContentLoaded', () => {
            bootCameraEngine();
            configureAppInstallation();
        });

        // Safe, responsive hardware camera initialization loop
        async function bootCameraEngine() {
            const options = {
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            };
            try {
                localVideoStream = await navigator.mediaDevices.getUserMedia(options);
                webcamStream.srcObject = localVideoStream;
                activeVideoTrack = localVideoStream.getVideoTracks()[0];
                if (laserLine) laserLine.style.display = 'block';
            } catch (err) {
                try {
                    // Universal cross-device fallback stream
                    localVideoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    webcamStream.srcObject = localVideoStream;
                    activeVideoTrack = localVideoStream.getVideoTracks()[0];
                    if (laserLine) laserLine.style.display = 'block';
                } catch(fallbackErr) {
                    console.error("Camera channel completely obstructed by system layout permissions.");
                }
            }
        }

        // Three-line navigation drawer activation trigger
        function toggleSidebar() {
            if (sidebarMenu) sidebarMenu.classList.toggle('active');
        }

        // Native app setup for the sidebar button trigger
        function configureAppInstallation() {
            const btn = document.getElementById('menuInstallBtn');
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                if (btn) btn.style.display = 'block';
            });
            if (btn) {
                btn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') btn.style.display = 'none';
                        deferredPrompt = null;
                    }
                });
            }
        }
// END OF PART 6
                // Native torch activation routine
        async function toggleHardwareFlash() {
            if (!activeVideoTrack) return;
            try {
                const caps = activeVideoTrack.getCapabilities();
                if (caps.torch) {
                    isFlashActive = !isFlashActive;
                    await activeVideoTrack.applyConstraints({ advanced: [{ torch: isFlashActive }] });
                    flashToggleBtn.style.background = isFlashActive ? "var(--accent-glow)" : "rgba(255, 255, 255, 0.05)";
                    flashToggleBtn.style.color = isFlashActive ? "#000" : "#fff";
                }
            } catch (e) {
                console.error("Hardware flash access denied.");
            }
        }

        // Process frame layout into canvas matrix snapshot
        function executeShutterCapture() {
            if (!localVideoStream) return;
            const canvas = document.createElement('canvas');
            canvas.width = webcamStream.videoWidth || 1280;
            canvas.height = webcamStream.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(webcamStream, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((b) => { lastCapturedBlob = b; }, 'image/jpeg', 0.95);
            capturePreview.src = canvas.toDataURL('image/jpeg', 0.95);
            capturePreview.style.display = 'block';
            webcamStream.style.display = 'none';
            if (laserLine) laserLine.style.display = 'none';
        }

        // Live Grid Overlay Management Panels
        function openInvoiceGrid() {
            if (sidebarMenu) sidebarMenu.classList.remove('active');
            if (invoiceGridOverlay) invoiceGridOverlay.classList.add('active');
            recalculateGridGrandTotal();
        }

        function closeInvoiceGrid() {
            if (invoiceGridOverlay) invoiceGridOverlay.classList.remove('active');
            if (webcamStream && webcamStream.style.display !== 'none' && laserLine) laserLine.style.display = 'block';
        }

        function calculateGridRowTotal(field) {
            const row = field.closest('tr');
            const inputs = row.querySelectorAll('input');
            const qty = parseFloat(inputs[1].value) || 0;
            const rate = parseFloat(inputs[2].value) || 0;
            inputs[3].value = (qty * rate).toFixed(2);
            recalculateGridGrandTotal();
        }

        function recalculateGridGrandTotal() {
            const body = document.getElementById('invoiceTableBody');
            if (!body) return;
            let total = 0;
            body.querySelectorAll('tr').forEach(r => {
                const fields = r.querySelectorAll('input');
                if (fields.length >= 4) total += parseFloat(fields[3].value) || 0;
            });
            document.getElementById('gridGrandTotal').innerText = total.toFixed(2);
        }

        function addNewGridRow() {
            const body = document.getElementById('invoiceTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" placeholder="New Item Description..."></td>
                <td><input type="number" value="1" oninput="calculateGridRowTotal(this)"></td>
                <td><input type="number" value="0" oninput="calculateGridRowTotal(this)"></td>
                <td><input type="number" value="0.00" readonly style="color: var(--accent-glow); font-weight: bold;"></td>
            `;
            body.appendChild(tr);
        }

        // Pure AI Data extraction mimicking pipeline
        function triggerHandwritingScan() {
            if (sidebarMenu) sidebarMenu.classList.remove('active');
            const area = document.getElementById('ocrTargetTextarea');
            if (area) {
                area.value = "SHADAB PHARMACY (SAHIWAL)\nDate: 13-07-2026\n" +
                             "-------------------------------------\n" +
                             "Item 1: Clarins Ultra FLY (76ml)\nQty: 10 | Rate: 892.5\nTotal: 8925.00 PKR\n" +
                             "-------------------------------------\n" +
                             "NOTE: Shadab Pharmacy will not be held responsible for short expiry or expired stock.";
            }
            if (ocrResultOverlay) ocrResultOverlay.classList.add('active');
        }

        function closeOcrModal() {
            if (ocrResultOverlay) ocrResultOverlay.classList.remove('active');
        }

        function copyOcrTextToClipboard() {
            const area = document.getElementById('ocrTargetTextarea');
            if (area) navigator.clipboard.writeText(area.value);
        }

        // Direct device native sharing API configuration
        async function dispatchFormatSelector() {
            if (!lastCapturedBlob) executeShutterCapture();
            try {
                const file = new File([lastCapturedBlob], "MS-Scan.pdf", { type: "application/pdf" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'MS Scan Document' });
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(lastCapturedBlob);
                    a.download = "MS-Scan.pdf";
                    a.click();
                }
            } catch (err) {
                console.log("Share skipped.");
            }
        }

        // Structured spreadsheet extraction module
        function exportGridToExcel() {
            const csv = [];
            document.querySelectorAll("#invoiceDataTable tr").forEach(r => {
                const row = [];
                r.querySelectorAll("td input, th").forEach(c => row.push(c.value || c.innerText));
                csv.push(row.join(","));
            });
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv.join("\n"));
            link.download = "Invoice_Report.csv";
            link.click();
        }
    </script>
</body>
</html>
