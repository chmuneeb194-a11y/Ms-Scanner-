<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ms Scanner - Advanced AI Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Premium Header */
        header { padding: 15px; text-align: center; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #334155; z-index: 10; }
        h1 { font-size: 20px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; }
        h1 span { color: var(--accent-blue); }

        /* Immersive Camera Area */
        .viewport-container { flex: 1; position: relative; background: black; overflow: hidden; }
        
        #video, #imagePreview { width: 100%; height: 100%; object-fit: cover; display: none; }
        #video { transform: scaleX(1); } /* Back camera usually non-mirrored */
        
        /* Scan Grid Overlay */
        .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7) 100%); pointer-events: none; border: 2px solid transparent; display: none; }
        .scan-line { position: absolute; top: -2px; left: 0; width: 100%; height: 2px; background: var(--accent-blue); animation: scanAnimation 3s infinite linear; }
        
        @keyframes scanAnimation { 0% { top: 0%; } 100% { top: 100%; } }

        /* UI Controls Layer */
        .controls-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 10; }
        
        .round-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s ease, background 0.3s ease; }
        .round-btn:active { transform: scale(0.9); }
        
        .btn-reset { background: #475569; display: none; }
        .btn-reset:hover { background: #334155; }
        
        .btn-capture { width: 80px; height: 80px; background: white; border: 5px solid rgba(255,255,255,0.3); font-size: 32px; color: var(--bg-dark); }
        .btn-capture:hover { background: #e2e8f0; }

        /* Right Floating Tool Icons */
        .tools-panel { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; }
        .tool-icon { width: 50px; height: 50px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-size: 20px; cursor: pointer; backdrop-filter: blur(5px); }

        /* Output Sliding Panel */
        .output-panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 80vh; background: var(--panel-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 25px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); transition: bottom 0.4s ease; overflow-y: auto; z-index: 100; }
        .output-panel.open { bottom: 0; }
        
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
        .panel-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .close-panel { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .result-group { margin-bottom: 25px; }
        .group-header { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .group-header i { color: var(--accent-blue); }

        /* Editable Output Card */
        .edit-card { background: var(--bg-dark); border-radius: 12px; border: 1px solid #334155; padding: 15px; }
        #editableText { width: 100%; height: 180px; background: none; border: none; color: var(--accent-blue); font-size: 16px; line-height: 1.6; resize: none; font-family: 'Fira Code', monospace; }
        #editableText:focus { outline: none; }

        /* Premium Calculation Banner */
        .calc-banner { display: flex; align-items: center; gap: 15px; background: linear-gradient(135deg, var(--accent-green) 0%, #064e3b 100%); padding: 18px; border-radius: 12px; font-weight: 700; color: white; display: none; }
        .calc-banner i { font-size: 24px; opacity: 0.8; }
        .calc-result { font-size: 18px; flex: 1; text-align: right; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 12px; margin-top: 20px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .btn-secondary { background: #334155; color: white; }
        .btn-primary { background: var(--accent-blue); color: #0f172a; }

    </style>
</head>
<body>

    <header>
        <h1><span>Ms</span> Scanner - Live Camera AI</h1>
    </header>

    <div class="viewport-container">
        <video id="video" autoplay playsinline></video>
        
        <img id="imagePreview" alt="Capture Preview">
        
        <div class="scan-overlay" id="scanOverlay">
            <div class="scan-line"></div>
        </div>

        <div class="tools-panel">
            <div class="tool-icon" title="Edit Text" onclick="toggleOutput()"><i class="fas fa-edit"></i></div>
            <div class="tool-icon" title="Share Text/PDF" onclick="shareContent()"><i class="fas fa-share-alt"></i></div>
            <div class="tool-icon" title="Download PDF" onclick="generatePDF()"><i class="fas fa-file-pdf"></i></div>
        </div>

        <div class="controls-overlay">
            <button class="round-btn btn-reset" id="resetBtn" onclick="resetFlow()">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="round-btn btn-capture" id="captureBtn" onclick="captureFrame()" style="display:flex;">
                <i class="fas fa-camera"></i>
            </button>
        </div>
    </div>

    <div class="output-panel" id="outputPanel">
        <div class="panel-header">
            <div class="panel-title">AI Scanner Engine</div>
            <button class="close-panel" onclick="toggleOutput()">&times;</button>
        </div>

        <div class="result-group">
            <div class="group-header">
                <i class="fas fa-keyboard"></i>
                Computerized Text (Edit Zone)
            </div>
            <div class="edit-card">
                <textarea id="editableText" oninput="reCalculate()" placeholder="Awaiting scan result..."></textarea>
            </div>
        </div>

        <div class="result-group">
            <div class="calc-banner" id="calcBox">
                <i class="fas fa-calculator"></i>
                <span>Real-Time Calculation</span>
                <div class="calc-result" id="mathResult">0</div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-action btn-secondary" onclick="resetFlow()"><i class="fas fa-redo"></i> Scan Again</button>
            <button class="btn-action btn-primary" onclick="shareContent()"><i class="fas fa-file-export"></i> Share Result</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const preview = document.getElementById('imagePreview');
        const captureBtn = document.getElementById('captureBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scanOverlay = document.getElementById('scanOverlay');
        const outputPanel = document.getElementById('outputPanel');
        let streamRef = null;

        // Automatically open the camera on load (back camera)
        window.onload = startCamera;

        /* FUNCTION START: startCamera */
        /* Iska kaam mobile ka back camera open karna ha */
        async function startCamera() {
            try {
                preview.style.display = 'none';
                video.style.display = 'block';
                scanOverlay.style.display = 'block';
                
                streamRef = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, // Back camera for mobile
                    audio: false 
                });
                
                video.srcObject = streamRef;
                captureBtn.style.display = 'flex';
                resetBtn.style.display = 'none'; // Hide reset during live feed
                outputPanel.classList.remove('open'); // Close panel if open
            } catch (err) {
                alert("Camera access denied! Please check permissions.");
                console.error(err);
            }
        }
        /* FUNCTION END: startCamera */

        /* FUNCTION START: captureFrame */
        /* Iska kaam current camera frame capture karna ha */
        function captureFrame() {
            if (!streamRef) return;

            // Capture current frame to Canvas
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Hide video and grid, show captured photo
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
            video.style.display = 'none';
            scanOverlay.style.display = 'none';
            captureBtn.style.display = 'none';
            resetBtn.style.display = 'flex'; // Show reset after capture

            // Simulation handwriting dynamic text result (will be updated via API later)
            const simulatedText = "Solar Array Scan: Area 51\nPlates: 20\nPanel Rate: 80\nTotal Bill: 20 * 80\n\nNotes: Full system check complete.\nScanner ID: MS-A2026";
            document.getElementById('editableText').value = simulatedText;
            
            // Re-run calculations and slide up the panel
            reCalculate();
            toggleOutput(true); // Always open when captured
        }
        /* FUNCTION END: captureFrame */

        /* FUNCTION START: resetFlow */
        /* Iska kaam camera reset karke wapas live feed chalu karna ha */
        function resetFlow() {
            if(streamRef) {
                 streamRef.getTracks().forEach(track => track.stop());
            }
            startCamera(); // Re-open the live cam
        }
        /* FUNCTION END: resetFlow */

        /* FUNCTION START: toggleOutput */
        /* Iska kaam result panel ko slide up/down karna ha */
        function toggleOutput(forceOpen = null) {
            if (forceOpen === true) {
                outputPanel.classList.add('open');
            } else if (forceOpen === false) {
                outputPanel.classList.remove('open');
            } else {
                outputPanel.classList.toggle('open');
            }
        }
        /* FUNCTION END: toggleOutput */

        /* FUNCTION START: reCalculate */
        /* Iska kaam scan text mein math dhoond kar calculation update karna ha */
        function reCalculate() {
            const text = document.getElementById('editableText').value;
            const calcBox = document.getElementById('calcBox');
            const mathResult = document.getElementById('mathResult');

            // Find an expression: [number] [*,/,+,-] [number]
            const mathMatch = text.match(/(\d+)\s*[\*|\+|-|\/]\s*(\d+)/);
            
            if (mathMatch) {
                try {
                    const expression = mathMatch[0];
                    const solution = eval(expression); // Safe as regex limits expression
                    mathResult.innerHTML = `<span>${expression}</span> = ${solution}`;
                    calcBox.style.display = 'flex';
                } catch(e) {
                    calcBox.style.display = 'none';
                }
            } else {
                calcBox.style.display = 'none';
            }
        }
        /* FUNCTION END: reCalculate */

        /* FUNCTION START: generatePDF */
        /* Iska kaam scan data ko PDF mein convert aur download karna ha */
        function generatePDF() {
            const text = document.getElementById('editableText').value;
            if(!text || text === "Awaiting scan result...") {
                alert("Scanner results needed before PDF generation.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // PDF Styling
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(56, 189, 248); // Accent blue
            doc.text("Ms Scanner - Advanced Scan Report", 15, 25);
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 15, 32);

            // Calculation (if present)
            const calcVisible = document.getElementById('calcBox').style.display === 'flex';
            if(calcVisible) {
                const mathRes = document.getElementById('mathResult').innerText;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.setTextColor(5, 150, 105); // Accent green
                doc.text(`Final Calculation: ${mathRes}`, 15, 45);
            }

            // Main OCR text
            doc.setFont("courier", "normal"); // Code-like for readability
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.text("Scanner Output:", 15, calcVisible ? 60 : 45);
            
            // Adjust text width for the page
            const textLines = doc.splitTextToSize(text, 180); 
            doc.text(textLines, 15, calcVisible ? 68 : 53);
            
            // Feature: Direct Download
            const filename = `MS-Scan_${new Date().toISOString().slice(0,10)}.pdf`;
            doc.save(filename);
            alert(`PDF "${filename}" generated and downloading! Check your downloads folder.`);
        }
        /* FUNCTION END: generatePDF */

        /* FUNCTION START: shareContent */
        /* Iska kaam phone ke native sharing menu ko open karna ha */
        async function shareContent() {
            const text = document.getElementById('editableText').value;
            if(!text || text === "Awaiting scan result...") {
                alert("Nothing to share yet. Capture and scan a page first.");
                return;
            }

            // Define the data to share
            const shareData = {
                title: 'Ms Scanner AI Result',
                text: `Scan output from Area 51:\n\n${text}`,
                // Potential future extension: Add PDF generation link here
            };

            try {
                // Feature: Web Share API (Native Share Sheet)
                if (navigator.share) {
                    await navigator.share(shareData);
                    console.log('Shared successfully');
                } else {
                    // Fallback for desktop/unsupported browsers (just copy text)
                    navigator.clipboard.writeText(shareData.text);
                    alert('Sharing not supported on this browser. Scan text copied to clipboard!');
                }
            } catch (err) {
                console.error('Share failed:', err);
            }
        }
        /* FUNCTION END: shareContent */
    </script>

</body>
</html>
