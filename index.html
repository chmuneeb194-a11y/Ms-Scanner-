<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms Scanner - 2026 AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .upload-section { border: 2px dashed #38bdf8; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 20px; background: #111827; }
        .upload-section input { display: none; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
        .btn { display: block; width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #0369a1; }
        .result-section { margin-top: 25px; display: none; }
        label { font-weight: bold; color: #94a3b8; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 150px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; border-radius: 6px; padding: 12px; font-size: 16px; resize: vertical; }
        .calc-box { margin-top: 15px; background: #047857; padding: 12px; border-radius: 6px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Ms Scanner - AI 2026</h2>
    
    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <p>📸 Tap here to Scan or Upload Image</p>
        <input type="file" id="fileInput" accept="image/*" onchange="previewFile()">
        <img id="imagePreview" class="preview-img" alt="Preview">
    </div>

    <button class="btn" onclick="processImage()">AI Scan & Calculate</button>

    <div class="result-section" id="resultSection">
        <label>📝 Computerized Text (Aap Edit kar sakte hain):</label>
        <textarea id="editableText" oninput="reCalculate()"></textarea>
        
        <div class="calc-box" id="calcBox">
            🔢 Live Calculation Jawab: <span id="mathResult">0</span>
        </div>
    </div>
</div>

<script>
    // Mobile file preview handler
    function previewFile() {
        const file = document.getElementById('fileInput').files[0];
        const preview = document.getElementById('imagePreview');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    // Dummy AI process simulation for frontend testing
    function processImage() {
        document.getElementById('resultSection').style.display = 'block';
        // Simulation handwriting dynamic text
        document.getElementById('editableText').value = "Total Solar Plates: 14 \nRate Per Plate: 80 \nTotal Bill: 14 * 80";
        reCalculate();
    }

    // Live Calculation Update Feature (2026 Advance Feature)
    function reCalculate() {
        const text = document.getElementById('editableText').value;
        const calcBox = document.getElementById('calcBox');
        const mathResult = document.getElementById('mathResult');

        // Regex to search expression like 14 * 80
        const mathMatch = text.match(/(\d+)\s*[\*|\+|-|\/]\s*(\d+)/);
        
        if (mathMatch) {
            try {
                const solution = eval(mathMatch[0]);
                mathResult.innerText = mathMatch[0] + " = " + solution;
                calcBox.style.display = 'block';
            } catch(e) {
                calcBox.style.display = 'none';
            }
        } else {
            calcBox.style.display = 'none';
        }
    }
</script>

</body>
</html>
