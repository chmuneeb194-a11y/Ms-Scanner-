<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms Scanner - Live AI Camera 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 24px; }
        
        /* Camera & Preview Styling */
        .camera-container { width: 100%; background: #111827; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 15px; border: 2px solid #334155; }
        video { width: 100%; display: none; transform: scaleX(1); }
        .preview-img { width: 100%; display: none; border-radius: 8px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn:hover { background: #0369a1; }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        
        .result-section { margin-top: 20px; display: none; }
        label { font-weight: bold; color: #94a3b8; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 140px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; border-radius: 6px; padding: 12px; font-size: 16px; }
        .calc-box { margin-top: 15px; background: #047857; padding: 12px; border-radius: 6px; font-weight: bold; display: none; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Ms Scanner - Live Camera AI</h2>
    
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <img id="imagePreview" class="preview-img" alt="Captured Frame">
    </div>

    <div class="controls">
        <button class="btn" id="startCamBtn" onclick="startCamera()">🎥 Start Live Cam</button>
        <button class="btn btn-success" id="captureBtn" onclick="captureFrame()" style="display:none;">📸 Scan Page</button>
    </div>

    <div class="result-section" id="resultSection">
        <label>📝 Computerized Text (Edit Zone):</label>
        <textarea id="editableText" oninput="reCalculate()"></textarea>
        
        <div class="calc-box" id="calcBox">
            🔢 Live Calculation: <span id="mathResult">0</span>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('imagePreview');
    const startCamBtn = document.getElementById('startCamBtn');
    const captureBtn = document.getElementById('captureBtn');
    let streamRef = null;

    // Mobile Phone ka Back Camera open karne ka function
    async function startCamera() {
        try {
            preview.style.display = 'none';
            video.style.display = 'block';
            
            // 'environment' select karne se mobile ka back camera khulega
            streamRef = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, 
                audio: false 
            });
            
            video.srcObject = streamRef;
            startCamBtn.innerText = "🔄 Reset Cam";
            captureBtn.style.display = 'inline-block';
        } catch (err) {
            alert("Camera access nahi mila! Please permissions check karein.");
            console.error(err);
        }
    }

    // Live frame capture karke scan simulation chalana
    function captureFrame() {
        if (!streamRef) return;

        // Canvas par current video frame draw karna
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Video stop karke photo preview dikhana
        preview.src = canvas.toDataURL('image/jpeg');
        preview.style.display = 'block';
        video.style.display = 'none';
        
        // Stream stop karna taake battery aur camera free ho jayein
        streamRef.getTracks().forEach(track => track.stop());

        // Process output simulation
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('editableText').value = "Scanned Plates: 20 \nPer Panel Cost: 80 \nFormula: 20 * 80";
        reCalculate();
    }

    // Live Edit aur Realtime Calculation tracking
    function reCalculate() {
        const text = document.getElementById('editableText').value;
        const calcBox = document.getElementById('calcBox');
        const mathResult = document.getElementById('mathResult');

        // Text mein se kisi bhi math expression (jaise 20 * 80) ko dhoondna
        const mathMatch = text.match(/(\d+)\s*[\*|\+|-|\/]\s*(\d+)/);
        
        if (mathMatch) {
            try {
                const solution = eval(mathMatch[0]);
                mathResult.innerText = mathMatch[0] + " = " + solution;
                calcBox.style.display = 'block';
            } catch(e) {
                calcBox.style.display = 'none';
            }
        } else {
            calcBox.style.display = 'none';
        }
    }
</script>

</body>
</html>
